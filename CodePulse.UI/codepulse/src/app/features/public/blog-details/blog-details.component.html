<ng-container *ngIf="blogPost | async as blogPost; else loading">
  <div class="container mt-5">
    <div class="row">
      <div class="col-md-8 col-sm-12 mx-auto">
        <div class="card shadow-lg rounded-3 mb-4 d-flex flex-column gap-2 p-lg-4">
          <img
            [src]="blogPost.featuredImageUrl"
            [alt]="blogPost.title"
            class="card-img-top shadow-sm border-bottom rounded-3"
          />
          <h1 class="card-title">{{ blogPost.title }}</h1>

          <div class="card-body px-0">
            <div class="d-flex justify-content-between">
              <span class="text-muted">
                {{ blogPost.author }}
              </span>
              <span class="text-muted">
                {{ blogPost.publishedDate | date }}
              </span>
            </div>
            <div *ngIf="blogPost.categories" class="mt-4">
              <span
                *ngFor="let category of blogPost.categories"
                class="badge text-bg-secondary me-1"
              >
                {{ category.name }}
              </span>
            </div>
            <div class="mt-4 blog-content">
                <markdown [data]="blogPost.content"></markdown>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-container>

<ng-template #loading>
  <div class="text-center mt-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</ng-template>
